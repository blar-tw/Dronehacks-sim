/**:
  ros__parameters:
    # Hardware defaults. Launch with use_sim_time in an ordinary ROS simulation.
    use_sim_time: false
    odom_topic: /visual_slam/tracking/odometry
    health_topic: /estimator/healthy
    world: flu
    # Unreferenced startup heading stays FRD. A surveyed reference must supply
    # BOTH heading_enu_rad and heading_reference; the bridge then rotates it.
    required_fields: [position, orientation]
    max_sample_age_s: 0.3
    health_quiet_s: 5.0
    # VIO loss (decision-1.md): never let PX4 go without vision long enough to
    # hit its no-aiding timeout (EKF2_NOAID_TOUT, 5 s default) -> failsafe.
    # Weak tracking = fewer features than min_features in a cuVSLAM frame: keep
    # sending, adding sigma = rate * seconds since the last good frame, capped.
    features_topic: /visual_slam/vis/observations_count
    state_topic: /estimator/vio_state
    min_features: 30
    pos_sigma_rate: 0.25    # m per s of weak tracking
    pos_sigma_max: 0.5      # m; keeps PX4's eph far below COM_POS_FS_EPH (5 m)
    vel_sigma_rate: 0.25    # m/s per s
    vel_sigma_max: 0.5      # m/s
    # Insane samples (jump/speed, health_quiet_s settling) are withheld at most
    # this long, then sent at the max sigma with one reset_counter bump, but only
    # once the samples are again consistent frame to frame: a sample that is itself
    # a fresh jump/over-speed restarts the clock and is never sent (the mission
    # lands after 3 s WITHHELD, before EKF2_NOAID_TOUT).
    withhold_max_s: 2.0
    # No feature count for this long (topic absent on this cuVSLAM build, or not
    # heard yet) = tracking quality UNKNOWN, not weak: samples go out unchanged
    # and the bridge logs one warning, instead of DEGRADED at max sigma forever.
    features_timeout_s: 1.0
